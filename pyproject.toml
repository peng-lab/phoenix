[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "phoenix"
version = "1.0.0"
description = "Pan-cancer virtual spatial transcriptomics from routine histology with Phoenix"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Rushin Gindra", email = "rushin.gindra@helmholtz-munich.de" },
]
authors = [
  { name = "Rushin Gindra" },
]
requires-python = ">=3.11"
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "anndata>=0.12.2",
  "matplotlib",
  "numpy",
  "pillow",
  "pyyaml",
  "scikit-learn",
  "scipy",
  # for debug logging (referenced from the issue template)
  "session-info2",
  "tqdm",
  "zuko>=1.3",
]
# Heavy compute stack used by the models/, trainers/, and h5py-backed datasets/ code.
# Kept optional so a base install (e.g. for demo_plot/inference tooling) doesn't require
# a working torch/CUDA setup.
optional-dependencies.full = [
  "h5py",
  "pytorch-lightning",
  "spatialdata",
  "timm",
  "torch",
  "torchvision",
  "vector-quantize-pytorch",
]
# Nuclei segmentation pipeline (helpers/segmentor.py).
optional-dependencies.segmentation = [
  "instanseg",
  "openslide-python",
  "scikit-image",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://phoenix.readthedocs.io/"
urls.Homepage = "https://github.com/peng-lab/phoenix"
urls.Source = "https://github.com/peng-lab/phoenix"

# apex, flash-attn, and xformers (used by models/flow_llama3.py and models/mlp_mixer_ae.py
# for the optimized transformer implementation) are intentionally NOT listed here: they
# require a matching CUDA toolchain to build and are not reliably pip-installable. Install
# them manually following their own instructions if you need the optimized model variant;
# models/flow_simple.py provides a pure-torch equivalent that needs only the `full` extra.
[dependency-groups]
dev = [
  "twine>=4.0.2",
]
test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
]
doc = [
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "scverse-misc[sphinx]>=0.1.2",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]
typecheck = [
  "mypy",
  "pandas-stubs",
]

[tool.hatch]
envs.default.installer = "uv"
envs.default.dependency-groups = [ "dev" ]
# The `full` extra is needed so autosummary can actually import datasets/, models.flow_simple,
# trainers/, and helpers/ for API doc generation (see docs/api.md for what's deliberately
# excluded: apex/flash-attn/xformers-dependent modules, and segmentor.py pending `segmentation`).
envs.docs.features = [ "full" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.docs.dependency-groups = [ "doc" ]
# Install the `full` extra so CI actually exercises datasets/, models.flow_simple,
# trainers/, and helpers/ instead of skipping every torch-dependent test. The
# apex/flash-attn/xformers-only modules (flow_llama3, mlp_mixer_ae) and the
# `segmentation` extra (segmentor.py) still skip -- see tests/test_imports.py
# and tests/test_models.py for why.
envs.hatch-test.features = [ "full" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.11", "3.12", "3.13" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.13" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]
envs.hatch-test.dependency-groups = [ "dev", "test" ]
envs.hatch-check-fmt.dependencies = [ "prek" ]
envs.hatch-check-fmt.scripts.format-check = "echo 'try `hatch check fmt --fix`'; false"
envs.hatch-check-fmt.scripts.format-fix = "prek run -a --group=format --no-group=typecheck"
envs.hatch-check-code.dependencies = [ "prek" ]
envs.hatch-check-code.scripts.lint-check = "echo 'try `hatch check code --fix`'; false"
envs.hatch-check-code.scripts.lint-fix = "prek run -a --no-group=format --no-group=typecheck"
envs.hatch-check-types.scripts.check = [ "mypy" ]
envs.hatch-check-types.dependency-groups = [ "typecheck", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
# phoenix_demo.ipynb is a large (6.5MB) demo notebook kept at the repo root for its published
# Colab/GitHub links; it is not part of the package and should not be reformatted.
extend-exclude = [ "phoenix_demo.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
# TEMPORARY: the pre-existing src/phoenix/** modules don't have numpydoc-style docstrings yet.
# Tracked for the follow-up conformance PR; remove this line once that lands.
lint.per-file-ignores."src/phoenix/**" = [ "D" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.mypy]
files = [ "src", "tests" ]

[[tool.mypy.overrides]]
# Scientific/ML stack used by src/phoenix that ships no type stubs.
module = [
  "apex.*",
  "flash_attn.*",
  "h5py.*",
  "instanseg.*",
  "openslide.*",
  "pytorch_lightning.*",
  "scipy.*",
  "skimage.*",
  "sklearn.*",
  "spatialdata.*",
  "timm.*",
  "torchvision.*",
  "tqdm.*",
  "vector_quantize_pytorch.*",
  "xformers.*",
  "yaml.*",
  "zuko.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# phoenix.models makes heavy use of dynamic torch module construction (e.g.
# attaching submodules to a plain nn.Module() at runtime) and implicit
# tensor-shape assumptions that a strict static check can't verify without
# executing the model. Fully resolving that would require behavioral changes to
# research code this migration can't validate at runtime (no GPU/test harness
# here) -- scoped out rather than silently "fixed" by guessing. See the PR
# description for the specific errors this was carved out for.
module = [
  "phoenix.models.*",
]
ignore_errors = true

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "phoenix" ]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "src/**/__init__.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
  # Existing project files preserved during the cookiecutter-scverse migration; see the
  # migration PR description for the reconciliation rationale for each.
  "LICENSE",
  "README.md",
  ".gitignore",
  "docs/index.md",
  "CHANGELOG.md",
  "phoenix_demo.ipynb",
]
